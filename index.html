<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTN MoMo Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f6;
    }

    .top {
      height: 42px;
      background: #111;
      color: #ffcc00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .hero {
      height: 255px;
      background: #08677d;
      color: white;
      text-align: center;
      padding-top: 35px;
      border-radius: 0 0 55px 55px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      background: #ffcc00;
      color: #08677d;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .hero h1 {
      margin-top: 18px;
      font-size: 30px;
    }

    .hero h1 span {
      color: #ffcc00;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .card {
      width: calc(100% - 30px);
      max-width: 450px;
      margin: -25px auto 30px;
      background: white;
      border-radius: 30px;
      padding: 28px 20px;
      box-shadow: 0 7px 22px rgba(0,0,0,.12);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    h2 {
      text-align: center;
      color: #08677d;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .row {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .flag {
      width: 72px;
      height: 72px;
      border: 1px solid #aaa;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
    }

    .input {
      flex: 1;
      border: 1px solid #999;
      border-radius: 20px;
      padding: 12px 14px;
    }

    .input label {
      display: block;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .input input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .pin-area {
      text-align: center;
    }

    .demo-number {
      border: 1px solid #aaa;
      border-radius: 20px;
      padding: 14px;
      color: #08677d;
      font-size: 18px;
      margin-bottom: 22px;
    }

    .pin-area input {
      width: 100%;
      border: 1px solid #999;
      border-radius: 20px;
      padding: 14px;
      text-align: center;
      font-size: 20px;
      letter-spacing: 5px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 22px;
      background: #ffcc00;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      background: #eee;
    }

    .success {
      text-align: center;
    }

    .success h2 {
      margin-bottom: 15px;
    }

    .success p {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="top">
    MTN MoMo — DEMO ONLY
  </div>

  <div class="hero">

    <div class="logo">
      MoMo
    </div>

    <h1>
      MoMo <span>MTN</span>
    </h1>

    <div class="subtitle">
      DEMO APPLICATION
    </div>

  </div>


  <div class="card">

    <!-- NUMBER PAGE -->
    <section id="numberPage" class="page active">

      <h2>Welcome to MoMo</h2>

      <div class="row">

        <div class="flag">
          🇺🇬
        </div>

        <div class="input">

          <label>Enter demo number</label>

          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            maxlength="9"
            placeholder="9-digit number"
          >

        </div>

      </div>

      <button onclick="continueDemo()">
        Continue
      </button>

    </section>


    <!-- PIN DEMO PAGE -->
    <section id="pinPage" class="page">

      <h2>Welcome to MoMo</h2>

      <div class="pin-area">

        <div class="demo-number">
          🇺🇬 +256 <span id="shownNumber"></span>
        </div>

        <input
          id="demoPin"
          type="password"
          inputmode="numeric"
          maxlength="5"
          placeholder="Enter 00000"
        >

        <button onclick="finishDemo()">
          Continue
        </button>

        <button class="back" onclick="goBack()">
          Back
        </button>

      </div>

    </section>


    <!-- SUCCESS PAGE -->
    <section id="successPage" class="page">

      <div class="success">

        <h2>Demo Successful</h2>

        <p>
          Demo completed successfully.
        </p>

        <button onclick="restartDemo()">
          Start Again
        </button>

      </div>

    </section>

  </div>


  <script>

    function showPage(id) {

      document.querySelectorAll(".page").forEach(function(page) {
        page.classList.remove("active");
      });

      document.getElementById(id).classList.add("active");
    }


    function continueDemo() {

      const phone =
        document.getElementById("phone").value.trim();

      if (!/^[0-9]{9}$/.test(phone)) {

        alert("Enter a 9-digit demo number.");

        return;
      }

      document.getElementById("shownNumber").textContent = phone;

      showPage("pinPage");
    }


    async function finishDemo() {

      const pin =
        document.getElementById("demoPin").value.trim();

      if (pin !== "00000") {

        alert("For this demo, enter 00000.");

        return;
      }

      const phone =
        document.getElementById("phone").value.trim();

      try {

        await fetch("/demo-submission", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            phone: phone,
            success: true
          })

        });

      } catch (error) {

        console.log("Demo notification failed.");

      }

      // Clear the PIN immediately.
      document.getElementById("demoPin").value = "";

      showPage("successPage");
    }


    function goBack() {

      document.getElementById("demoPin").value = "";

      showPage("numberPage");
    }


    function restartDemo() {

      document.getElementById("phone").value = "";

      document.getElementById("demoPin").value = "";

      document.getElementById("shownNumber").textContent = "";

      showPage("numberPage");
    }

  </script>

</body>
</html>
